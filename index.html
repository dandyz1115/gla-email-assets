<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丹迪图床</title>
<style>
  :root{color-scheme:light;--paper:#f8f6ef;--ink:#172e29;--muted:#53635b;--rule:#d8ddd1;--accent:#26634e;--surface:#fffefa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "DM Sans","PingFang SC","Microsoft YaHei",sans-serif}
  .shell{width:min(1144px,calc(100% - 64px));margin-inline:auto}
  header{padding:54px 0 34px;border-bottom:1px solid var(--rule);background:#e9eee4}
  h1,h2,h3,p{margin:0}
  h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(44px,8vw,84px);line-height:1.1;letter-spacing:-.055em}
  header p{margin-top:14px;color:var(--muted)}
  main{padding:34px 0 60px}
  section+section{margin-top:42px}
  h2{font-size:21px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  article{min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
  .preview{display:grid;place-items:center;background:#e7ebe2;border-bottom:1px solid var(--rule)}
  .preview img{display:block;width:100%;height:auto}
  .secondary .preview{height:192px;padding:16px}
  .secondary .preview img{width:auto;height:auto;max-width:100%;max-height:159px;object-fit:contain}
  .secondary .preview .logo{width:min(70%,290px)}
  .body{padding:18px 20px 20px}
  h3{font-size:clamp(17px,2.2vw,23px);line-height:1.35;overflow-wrap:anywhere}
  .variant{margin-top:16px}
  .variant+.variant{padding-top:14px;border-top:1px solid var(--rule)}
  .variant p{font-size:13px;color:var(--muted);margin-bottom:8px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  a,button{font:inherit}
  .actions>*{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;background:transparent;color:var(--ink);text-decoration:none;font-size:13px;cursor:pointer}
  .actions button[data-copy="url"]{background:var(--accent);border-color:var(--accent);color:white}
  .actions>*:hover{box-shadow:inset 0 0 0 99px #12251b12}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #copy-status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:8px 16px;border-radius:6px;background:var(--ink);color:white}
  #copy-status:empty{clip-path:inset(50%);padding:0}
  @media(max-width:700px){
    .shell{width:calc(100% - 32px)}
    header{padding:36px 0 24px}
    main{padding-top:24px}
    .grid{grid-template-columns:1fr;gap:14px}
    .body{padding:14px}
  }
</style>
</head>
<body>
<header>
  <div class="shell">
    <h1>丹迪图床</h1>
    <p>预览图片，复制直链或邮件 HTML。</p>
  </div>
</header>
<main class="shell">
  <section aria-labelledby="banners">
    <h2 id="banners">第十六届 GLA 全球物流大会横幅</h2>
    <div class="grid">
      <article>
        <a class="preview" href="gla-16th-conference-banner.jpg" target="_blank" rel="noopener">
          <img src="gla-16th-conference-banner.jpg" width="2400" height="800" alt="带 Mencia WhatsApp 二维码的大会横幅">
        </a>
        <div class="body">
          <h3>Mencia 的 WhatsApp 二维码横幅</h3>
          <div class="variant" data-width="600" data-height="200" data-alt="The 16th GLA Global Logistics Conference — Mencia WhatsApp">
            <p>高清版 · 2400 × 800</p>
            <div class="actions">
              <a href="gla-16th-conference-banner.jpg" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
          <div class="variant" data-width="600" data-height="200" data-alt="The 16th GLA Global Logistics Conference — Mencia WhatsApp">
            <p>轻量版 · 1600 × 533</p>
            <div class="actions">
              <a href="gla-16th-conference-banner-1600.jpg" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
        </div>
      </article>
      <article>
        <a class="preview" href="gla-16th-conference-banner-v2.jpg" target="_blank" rel="noopener">
          <img src="gla-16th-conference-banner-v2.jpg" width="1920" height="640" alt="带项目组官方二维码的大会横幅">
        </a>
        <div class="body">
          <h3>项目组官方二维码横幅</h3>
          <div class="variant" data-width="600" data-height="200" data-alt="The 16th GLA Global Logistics Conference — Official project team QR code">
            <p>1920 × 640 · 发邮件前请先测试扫码</p>
            <div class="actions">
              <a href="gla-16th-conference-banner-v2.jpg" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>
  <section class="secondary" aria-labelledby="other-assets">
    <h2 id="other-assets">其他素材</h2>
    <div class="grid">
      <article id="gla-irene">
        <a class="preview" href="gla-16th-conference-irene-1600.jpg" target="_blank" rel="noopener">
          <img src="gla-16th-conference-irene-1600.jpg" width="1600" height="2400" loading="lazy" alt="GLA Irene">
        </a>
        <div class="body">
          <h3>GLA Irene</h3>
          <div class="variant" data-width="600" data-height="900" data-alt="GLA Irene">
            <p>高清版 · 4664 × 6996</p>
            <div class="actions">
              <a href="gla-16th-conference-irene.jpg" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
          <div class="variant" data-width="600" data-height="900" data-alt="GLA Irene">
            <p>轻量版 · 1600 × 2400</p>
            <div class="actions">
              <a href="gla-16th-conference-irene-1600.jpg" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
        </div>
      </article>
      <article>
        <a class="preview" href="gla-logo.png" target="_blank" rel="noopener">
          <img class="logo" src="gla-logo.png" width="4800" height="1676" loading="lazy" alt="GLA Global Logistics Alliance">
        </a>
        <div class="body">
          <h3>GLA Logo</h3>
          <div class="variant" data-width="240" data-height="84" data-alt="GLA Global Logistics Alliance">
            <p>英文版 · 透明底 PNG</p>
            <div class="actions">
              <a href="gla-logo.png" target="_blank" rel="noopener">打开图片</a>
              <button type="button" data-copy="url">复制直链</button>
              <button type="button" data-copy="html">复制 HTML</button>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>
</main>
<p id="copy-status" role="status"></p>
<script>
  const status = document.querySelector('#copy-status');
  let statusTimer;
  document.querySelector('main').addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-copy]');
    if (!button) return;

    const variant = button.closest('.variant');
    const url = variant.querySelector('a').href;
    const {width, height, alt} = variant.dataset;
    const isHtml = button.dataset.copy === 'html';
    const text = isHtml
      ? `<img src="${url}" width="${width}" height="${height}" alt="${alt}" style="display:block;width:100%;max-width:${width}px;height:auto;border:0;">`
      : url;
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = isHtml ? '已复制 HTML' : '已复制直链';
    } catch {
      window.prompt('请手动复制', text);
      return;
    }
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { status.textContent = ''; }, 2200);
  });
</script>
</body>
</html>
